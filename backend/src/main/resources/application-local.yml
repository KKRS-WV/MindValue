spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/mindvault
    username: postgres
    password: ${MINDVAULT_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: never

logging:
  level:
    org.hibernate.SQL: warn
